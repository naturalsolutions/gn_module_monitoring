<div class="breadcrumbs" *ngIf="breadcrumbs">
  <button type="button" class="link" [attr.aria-label]="'Home' | translate" (click)="onClick()">
    <i class="fa fa-home" aria-hidden="true"></i>
  </button>
  /

  <span *ngFor="let elem of breadcrumbs; let isLast = last">
    <button type="button" class="link" (click)="onClick(elem)"><span *ngIf="elem.label">{{ elem.label }}{{ 'ColonCharSpaced' | translate }}</span> {{ elem.description
      }}</button>
    <span *ngIf="!isLast"> / </span>
  </span>
</div>
